services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./mcp_servers:/mcp_servers
      - ./skill:/skill
      - ./scripts:/app/scripts
      - ./evals:/app/evals
      - ./checkpoints:/app/checkpoints
      - ./sessions:/app/sessions
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
